<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Doğum Günü Şenliği</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
/* Layout: tek sütun, ortada bir fotoğraf kartı; üstünde parti şapkası, altında konuşma balonu, sonra pasta. Konfeti ve balonlar arka planda. */
:root {
  color-scheme: dark;
  --ink: #1a1240;
  --ink-2: #2a1f63;
  --paper: #fff4de;
  --hot: #ff4d8d;
  --sun: #ffc933;
  --mint: #2fe0b5;
  --sky: #52c8ff;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% 0%, var(--ink-2) 0%, var(--ink) 60%);
  background-color: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.balloons { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.balloon {
  position: absolute; bottom: -140px; width: 54px; height: 66px; border-radius: 50% 50% 48% 48%;
  pointer-events: auto; cursor: pointer; animation: rise 14s linear infinite;
  box-shadow: inset -8px -10px 0 rgba(0,0,0,.14), inset 7px 8px 0 rgba(255,255,255,.22);
}
.balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 70px; background: rgba(255,244,222,.45); transform: translateX(-50%); }
.balloon::before { content: ""; position: absolute; left: 50%; top: calc(100% - 3px); width: 10px; height: 8px; background: inherit; clip-path: polygon(50% 0, 100% 100%, 0 100%); transform: translateX(-50%); }
.balloon.pop { animation: pop .35s ease-out forwards; }
@keyframes rise { 0% { transform: translateY(0) translateX(0) rotate(-4deg); } 50% { transform: translateY(-60vh) translateX(18px) rotate(4deg); } 100% { transform: translateY(-125vh) translateX(-12px) rotate(-4deg); } }
@keyframes pop { to { transform: scale(1.8); opacity: 0; } }

main { position: relative; z-index: 2; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 22px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.5rem, 13vw, 3.6rem); line-height: .95; text-align: center; text-wrap: balance; letter-spacing: .01em; }
h1 .l1 { color: var(--sun); display: block; }
h1 .l2 { color: var(--hot); display: block; transform: rotate(-2deg); text-shadow: 3px 3px 0 var(--ink-2); }
.who { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
.who label { display: flex; flex-direction: column; gap: 4px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--sky); min-width: 0; }
.who input {
  font: 800 1.1rem var(--font-body); color: var(--paper); background: rgba(255,244,222,.08);
  border: 2px dashed rgba(255,244,222,.4); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; text-align: center;
}
.who input:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.who .name { flex: 1 1 200px; }
.who .age { flex: 0 1 110px; }
.who input::placeholder { color: rgba(255,244,222,.5); font-weight: 400; }

.stage { position: relative; width: min(78vw, 300px); margin-top: 52px; }
.frame { background: var(--paper); padding: 10px 10px 34px; border-radius: 6px; transform: rotate(-3deg); animation: wobble 4s ease-in-out infinite; box-shadow: 0 18px 0 -6px rgba(0,0,0,.25), 0 22px 40px rgba(0,0,0,.4); }
.frame img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 3px; }
.frame .cap { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--ink); font: 800 .85rem var(--font-body); }
@keyframes wobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(2deg) translateY(-4px); } }
.hat { position: absolute; left: 50%; top: -64px; width: 96px; height: 92px; transform: translateX(-50%) rotate(-7deg); z-index: 2; animation: wobble 4s ease-in-out infinite; transform-origin: 50% 100%; }
.hat svg { width: 100%; height: 100%; display: block; overflow: visible; }

.bubble { position: relative; background: var(--paper); color: var(--ink); border-radius: 22px; padding: 16px 18px; font-weight: 600; text-align: center; min-height: 92px; width: 100%; display: flex; align-items: center; justify-content: center; text-wrap: pretty; }
.bubble::before { content: ""; position: absolute; top: -12px; left: 50%; width: 22px; height: 22px; background: var(--paper); transform: translateX(-50%) rotate(45deg); border-radius: 4px; }
.bubble p { margin: 0; position: relative; animation: pip .35s ease-out; }
@keyframes pip { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }

button { font: 800 1rem var(--font-body); border: 0; border-radius: 999px; padding: 13px 22px; cursor: pointer; color: var(--ink); background: var(--sun); box-shadow: 0 5px 0 #b98b00; transition: transform .1s, box-shadow .1s; touch-action: manipulation; }
button:active { transform: translateY(4px); box-shadow: 0 1px 0 #b98b00; }
button.hot { background: var(--hot); color: #fff; box-shadow: 0 5px 0 #b3265c; }
button.hot:active { box-shadow: 0 1px 0 #b3265c; }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

.cakebox { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.cakebox svg { width: min(86vw, 340px); height: auto; overflow: visible; }
.flame { transform-origin: 50% 100%; transform-box: fill-box; animation: flick .5s ease-in-out infinite alternate; }
.flame:nth-of-type(2n) { animation-duration: .38s; }
@keyframes flick { from { transform: scale(1, 1) rotate(-4deg); } to { transform: scale(.88, 1.12) rotate(4deg); } }
.out .flame { display: none; }
.smoke { opacity: 0; }
.out .smoke { animation: smoke 1.6s ease-out forwards; }
@keyframes smoke { 0% { opacity: .8; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-34px); } }
.wish { min-height: 1.5em; margin: 0; font-weight: 800; color: var(--mint); text-align: center; }
.foot { font-size: .8rem; color: rgba(255,244,222,.6); text-align: center; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .frame, .hat, .flame, .balloon { animation: none; }
  .balloon { bottom: 20vh; }
}
</style>

  var jokeEl = $("joke"), ji = Math.floor(Math.random() * jokes.length);
  function showJoke() {
    var p = document.createElement("p");
    p.id = "joke";
    p.textContent = jokes[ji % jokes.length];
    jokeEl.replaceWith(p);
    jokeEl = p;
    ji++;
  }
  showJoke();
  var timer = setInterval(showJoke, 6500);
  $("nextJoke").addEventListener("click", function () { clearInterval(timer); showJoke(); timer = setInterval(showJoke, 8000); burst(innerWidth / 2, innerHeight * .4, 40); });

  /* ---------- isim ve yaş ---------- */
  var nameIn = $("nameIn"), ageIn = $("ageIn");
  function refresh() {
    var n = nameIn.value.trim();
    $("bigName").textContent = n ? n + "!" : "kral!";
    var a = parseInt(ageIn.value, 10);
    if (a > 0 && a < 121) {
      var face = Math.max(7, a - 8);
      $("cap").textContent = "Resmî yaş: " + a + "  |  Yüzün: " + face;
    } else {
      $("cap").textContent = "Resmî yaş: ??  |  Görünen yaş: gizli";
    }
  }
  nameIn.addEventListener("input", refresh);
  ageIn.addEventListener("input", refresh);
  refresh();

  /* ---------- konfeti ---------- */
  var cv = $("confetti"), cx = cv.getContext("2d"), parts = [], W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
  var colors = ["#ff4d8d", "#ffc933", "#2fe0b5", "#52c8ff", "#fff4de"];
  function resize() { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  resize(); addEventListener("resize", resize);
  function spawn(x, y, vx, vy) {
    parts.push({ x: x, y: y, vx: vx, vy: vy, w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[(Math.random() * colors.length) | 0], life: 1 });
  }
  function rain() { if (parts.length < (reduce ? 0 : 55)) spawn(Math.random() * W, -12, (Math.random() - .5) * .8, 1.2 + Math.random() * 1.6); }
  function burst(x, y, n) {
    n = reduce ? Math.min(n, 12) : n;
    for (var i = 0; i < n; i++) { var a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 8; spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - 4); }
  }
  function tick() {
    cx.clearRect(0, 0, W, H);
    rain();
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += .12; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 20) { parts.splice(i, 1); continue; }
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(function () { burst(innerWidth / 2, innerHeight * .3, 90); }, 400);

  /* ---------- balonlar ---------- */
  var bl = $("balloons"), bcolors = ["#ff4d8d", "#ffc933", "#2fe0b5", "#52c8ff", "#ff7a45", "#b58cff"];
  for (var i = 0; i < 8; i++) {
    var b = document.createElement("div");
    b.className = "balloon";
    b.style.left = (4 + i * 12.5) + "%";
    b.style.background = bcolors[i % bcolors.length];
    b.style.animationDuration = (11 + (i * 1.7) % 7) + "s";
    b.style.animationDelay = (-i * 2.3) + "s";
    b.addEventListener("pointerdown", function (e) {
      var el = e.currentTarget, r = el.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 30);
      el.classList.add("pop");
      setTimeout(function () { el.classList.remove("pop"); }, 700);
    });
    bl.appendChild(b);
  }

  /* ---------- pasta ---------- */
  var box = $("cakebox"), out = false, wi = 0;
  $("blow").addEventListener("click", function () {
    out = !out;
    box.classList.toggle("out", out);
    $("blow").textContent = out ? "Tekrar yak" : "Mumları üfle";
    $("wish").textContent = out ? wishes[wi++ % wishes.length] : "Önce bir dilek tut.";
    if (out) { var r = box.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + 40, 80); }
  });
  $("boom").addEventListener("click", function () {
    burst(innerWidth * .2, innerHeight * .6, 50);
    burst(innerWidth * .8, innerHeight * .6, 50);
    burst(innerWidth * .5, innerHeight * .35, 70);
  });
})();
</script>

</body></html>
